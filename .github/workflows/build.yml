name: Build Watch Hotspot

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Crea struttura minima Gradle se assente
        run: |
          if [ ! -f "settings.gradle.kts" ] && [ ! -f "settings.gradle" ]; then
            echo "rootProject.name = 'WatchHotspot'" > settings.gradle
          fi
          if [ ! -f "build.gradle" ] && [ ! -f "build.gradle.kts" ]; then
            echo "plugins { id 'com.android.application' version '8.1.0' apply false }" > build.gradle
          fi
          mkdir -p app/src/main
          if [ ! -f "app/build.gradle" ]; then
            cat << 'EOF' > app/build.gradle
            plugins {
                id 'com.android.application'
            }
            android {
                namespace 'com.watchhotspot'
                compileSdk 34
                defaultConfig {
                    applicationId "com.watchhotspot"
                    minSdk 30
                    targetSdk 34
                    versionCode 1
                    versionName "1.0"
                }
            }
            EOF
          }
          gradle wrapper

      - name: Compila APK con Gradle
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Watch-Hotspot-APK
          path: |
            app/build/outputs/apk/debug/*.apk